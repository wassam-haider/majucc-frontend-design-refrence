<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Combined Minecraft Textures</title>
<style>
  /* --- GLOBAL PAGE SETUP --- */
  body {
    background-color: #2c2f33; /* Dark background */
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 60px;
    padding: 60px 20px;
    margin: 0;
    font-family: sans-serif;
    color: #ffffff;
  }

  .block-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }

  .block-name {
    font-size: 1.5rem;
    font-weight: bold;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    margin: 0;
  }

  /* --- COMMON PIXEL CANVAS --- */
  .pixel-canvas {
    display: grid;
    grid-template-columns: repeat(16, 1fr);
    grid-template-rows: repeat(16, 1fr);
    width: 320px; /* 20px per pixel */
    height: 320px;
  }

  .pixel-canvas div {
    width: 100%;
    height: 100%;
  }

  /* =========================================
     1. END PORTAL TEXTURE
     ========================================= */
  .end-portal-section {
    width: 100%; /* Force onto its own row as a banner */
  }
  .end-portal-section .end-portal {
    width: 80vw;
    max-width: 1000px;
    height: 40vh;
    min-height: 320px;
    border: 6px solid #111;
    border-radius: 4px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), inset 0 0 50px rgba(0,0,0,0.9);
    background-color: #030005;
    background-image:
      radial-gradient(1.5px 1.5px at 10px 10px, #eebaff 100%, transparent 100%),
      radial-gradient(1.5px 1.5px at 70px 45px, #d27df0 100%, transparent 100%),
      radial-gradient(1.5px 1.5px at 120px 90px, #f1ccff 100%, transparent 100%),
      radial-gradient(1.5px 1.5px at 20px 30px, #9322cc 100%, transparent 100%),
      radial-gradient(1.5px 1.5px at 55px 70px, #a12be0 100%, transparent 100%),
      radial-gradient(1.5px 1.5px at 90px 15px, #7514a6 100%, transparent 100%),
      radial-gradient(1.5px 1.5px at 140px 60px, #821db5 100%, transparent 100%),
      radial-gradient(1.5px 1.5px at 45px 110px, #b03beb 100%, transparent 100%),
      radial-gradient(2px 2px at 5px 50px, #330b4d 100%, transparent 100%),
      radial-gradient(2px 2px at 35px 15px, #2a0840 100%, transparent 100%),
      radial-gradient(2px 2px at 80px 40px, #40105e 100%, transparent 100%),
      radial-gradient(2px 2px at 100px 80px, #210433 100%, transparent 100%),
      radial-gradient(2px 2px at 15px 95px, #360a4f 100%, transparent 100%),
      radial-gradient(2px 2px at 65px 105px, #461463 100%, transparent 100%),
      radial-gradient(2px 2px at 115px 25px, #1c0529 100%, transparent 100%),
      radial-gradient(1px 1px at 25px 25px, #180424 100%, transparent 100%),
      radial-gradient(1px 1px at 60px 5px,  #15031f 100%, transparent 100%),
      radial-gradient(1px 1px at 95px 65px, #200630 100%, transparent 100%),
      radial-gradient(1px 1px at 15px 75px, #100217 100%, transparent 100%),
      radial-gradient(1px 1px at 130px 35px, #1c0529 100%, transparent 100%),
      radial-gradient(1px 1px at 50px 90px, #15031f 100%, transparent 100%),
      radial-gradient(1px 1px at 105px 115px, #180424 100%, transparent 100%);
    background-size:
      131px 137px, 163px 167px, 191px 193px,
      67px 71px, 83px 89px, 97px 101px, 107px 109px, 113px 127px,
      37px 41px, 43px 47px, 53px 59px, 61px 67px, 73px 79px, 89px 97px, 103px 107px,
      17px 19px, 23px 29px, 31px 37px, 41px 43px, 47px 53px, 59px 61px, 71px 73px;
    background-attachment: fixed;
  }

  /* =========================================
     2. PURPUR BLOCK
     ========================================= */
  .purpur-section .pixel-canvas {
    border: 4px solid #222222;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
  }
  .purpur-section .p1 { background-color: #cdacd0; } 
  .purpur-section .p2 { background-color: #b997be; } 
  .purpur-section .p3 { background-color: #aa80ad; } 
  .purpur-section .p4 { background-color: #946594; } 

  /* =========================================
     3. WARPED NYLIUM BLOCK
     ========================================= */

    border: 4px solid #1a1a1a;

  .warped-nylium-section .t1 { background-color: #169c8a; }

  .warped-nylium-section .r2 { background-color: #7b4041; } 
  .warped-nylium-section .r3 { background-color: #5d2b2b; } 
  .warped-nylium-section .r4 { background-color: #3b1b1b; } 
  .warped-nylium-section .r5 { background-color: #210d0d; } 

  /* =========================================
     4. NETHER BRICK
     ========================================= */
  .nether-brick-section .pixel-canvas {
    border: 4px solid #111111; 
    box-shadow: 0 15px 35px rgba(0,0,0,0.6);
  }
  .nether-brick-section .n1 { background-color: #741111; } 
  .nether-brick-section .n2 { background-color: #560808; } 
  .nether-brick-section .n3 { background-color: #3a0404; } 
  .nether-brick-section .n4 { background-color: #210202; } 
  .nether-brick-section .n5 { background-color: #120101; } 

  /* =========================================

    border: 4px solid #111111;

  }
  .lava-section .l1 { background-color: #ffeb3b; } 
  .lava-section .l2 { background-color: #fdd835; } 
  .lava-section .l3 { background-color: #fb8c00; } 
  .lava-section .l4 { background-color: #e65100; } 
  .lava-section .l5 { background-color: #bf360c; } 

  /* =========================================
     6. GRASS BLOCK
     ========================================= */
  .grass-section .pixel-canvas {
    border: 4px solid #222222; 
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
  }
  .grass-section .g1 { background-color: #86c74d; } 
  .grass-section .g2 { background-color: #79b642; } 
  .grass-section .g3 { background-color: #6ba13a; } 
  .grass-section .g4 { background-color: #5b8731; } 
  .grass-section .g5 { background-color: #4d7429; } 
  .grass-section .d1 { background-color: #966c56; } 
  .grass-section .d2 { background-color: #86604c; } 
  .grass-section .d3 { background-color: #745444; } 
  .grass-section .d4 { background-color: #604538; } 
  .grass-section .s1 { background-color: #787878; } 
  .grass-section .s2 { background-color: #646464; } 

  /* =========================================
     7. DIRT BLOCK
     ========================================= */
  .dirt-section .pixel-canvas {
    border: 4px solid #222222; 
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
  }

  .cobblestone-section .c5 { background-color: #404040; } 

  /* =========================================
     9. END STONE BLOCK
     ========================================= */
  .end-stone-section .pixel-canvas {
    border: 4px solid #222222;

  }

  .end-stone-section .e4 { background-color: #c4cc7b; } 
  .end-stone-section .e5 { background-color: #b2ba65; } 

</style>
