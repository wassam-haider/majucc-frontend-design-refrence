<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAJU CodeCraft — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#1A1A1E;
    --sky-bottom:#302426;
    --grass-top:#E8442C;
    --grass-side:#B32F1E;
    --dirt:#241E1D;
    --dirt-dark:#141010;
    --stone:#3A3A3E;
    --stone-dark:#232326;
    --plank:#B8863E;
    --plank-dark:#96692C;
    --ui-bg:#1C1C20;
    --ui-dark:#0A0A0C;
    --ui-light:#FFFFFF;
    --gold:#FF8A3D;
    --ember:#FFB238;
    --torch:#FF8A3D;
    --text-dark:#F2F2F2;
    --font-pixel:'Press Start 2P', monospace;
    --font-body:'VT323', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%; height:100%;
    overflow:hidden;
    font-family:var(--font-body);
    image-rendering:pixelated;
  }
  body{
    position:relative;
    background:linear-gradient(var(--sky-top), var(--sky-bottom) 70%);
  }

  /* ===================== WORLD BACKGROUND ===================== */
  #world{
    position:absolute; inset:0;
    overflow:hidden;
  }

  .cloud{
    position:absolute;
    image-rendering:pixelated;
    opacity:0.9;
    animation:driftCloud linear infinite;
  }
  .cloud svg{ display:block; width:100%; height:100%; }
  @keyframes driftCloud{
    from{ transform:translateX(-140px); }
    to{ transform:translateX(calc(100vw + 140px)); }
  }

  #parallax-far, #parallax-near{
    position:absolute; inset:0;
    transition:transform 0.15s ease-out;
    will-change:transform;
  }

  /* Terrain strip built from pixel blocks */
  .terrain{
    position:absolute;
    left:0; right:0; bottom:0;
    display:flex;
    height:220px;
  }
  .block-col{
    flex:1 0 64px;
    display:flex;
    flex-direction:column;
    min-width:64px;
  }
  .block{
    width:100%;
    height:64px;
    position:relative;
    flex-shrink:0;
  }
  .grass-block{
    background:
      linear-gradient(var(--grass-top), var(--grass-top) 22%, transparent 22%),
      var(--grass-side);
    box-shadow:
      inset -6px 0 0 rgba(0,0,0,0.25),
      inset 0 -6px 0 rgba(0,0,0,0.3),
      inset 6px 0 0 rgba(255,178,56,0.12),
      inset 0 6px 0 rgba(255,178,56,0.2);
  }
  .grass-block::after{
    content:"";
    position:absolute; inset:0;
    background-image:
      radial-gradient(circle at 15% 30%, rgba(0,0,0,0.15) 3px, transparent 3px),
      radial-gradient(circle at 70% 15%, rgba(255,178,56,0.25) 3px, transparent 3px),
      radial-gradient(circle at 45% 60%, rgba(0,0,0,0.12) 3px, transparent 3px),
      radial-gradient(circle at 85% 70%, rgba(0,0,0,0.15) 3px, transparent 3px);
  }
  .dirt-block{
    background:var(--dirt);
    box-shadow:
      inset -6px 0 0 rgba(0,0,0,0.3),
      inset 0 -6px 0 rgba(0,0,0,0.4),
      inset 6px 0 0 rgba(255,138,61,0.06),
      inset 0 6px 0 rgba(255,138,61,0.1);
  }
  .dirt-block::after{
    content:"";
    position:absolute; inset:0;
    background-image:
      radial-gradient(circle at 20% 25%, rgba(255,138,61,0.1) 4px, transparent 4px),
      radial-gradient(circle at 65% 55%, rgba(0,0,0,0.3) 3px, transparent 3px),
      radial-gradient(circle at 40% 75%, rgba(0,0,0,0.3) 4px, transparent 4px),
      radial-gradient(circle at 80% 20%, rgba(255,138,61,0.08) 3px, transparent 3px);
  }
  .stone-block{
    background:var(--stone);
    box-shadow:
      inset -6px 0 0 rgba(0,0,0,0.3),
      inset 0 -6px 0 rgba(0,0,0,0.35),
      inset 6px 0 0 rgba(255,255,255,0.06),
      inset 0 6px 0 rgba(255,255,255,0.08);
  }
  .stone-block::after{
    content:"";
    position:absolute; inset:0;
    background-image:
      radial-gradient(circle at 25% 30%, rgba(0,0,0,0.25) 5px, transparent 5px),
      radial-gradient(circle at 70% 65%, rgba(255,255,255,0.05) 4px, transparent 4px),
      radial-gradient(circle at 50% 20%, rgba(255,138,61,0.06) 3px, transparent 3px);
  }

  /* Floating breakable ore blocks, decorative + interactive */
  .float-block{
    position:absolute;
    width:56px; height:56px;
    cursor:pointer;
    background:var(--stone);
    box-shadow:
      inset -5px 0 0 rgba(0,0,0,0.3),
      inset 0 -5px 0 rgba(0,0,0,0.35),
      inset 5px 0 0 rgba(255,255,255,0.06),
      inset 0 5px 0 rgba(255,255,255,0.1);
    animation:bob 3.2s ease-in-out infinite;
    transition:filter 0.15s;
  }
  .float-block::after{
    content:"";
    position:absolute; inset:0;
  }
  .float-block.gold::after{
    background-image:
      radial-gradient(circle at 30% 30%, var(--gold) 5px, transparent 5px),
      radial-gradient(circle at 65% 55%, var(--gold) 4px, transparent 4px),
      radial-gradient(circle at 45% 75%, var(--gold) 4px, transparent 4px),
      radial-gradient(circle at 75% 25%, var(--gold) 3px, transparent 3px);
  }
  .float-block.diamond::after{
    background-image:
      radial-gradient(circle at 30% 30%, #FFD9B0 5px, transparent 5px),
      radial-gradient(circle at 65% 55%, #FFD9B0 4px, transparent 4px),
      radial-gradient(circle at 45% 75%, #FFD9B0 4px, transparent 4px),
      radial-gradient(circle at 75% 25%, #FFD9B0 3px, transparent 3px);
  }
  .float-block .crack{
    position:absolute; inset:0;
    background-image:repeating-linear-gradient(45deg, rgba(0,0,0,0.5) 0 2px, transparent 2px 6px);
    opacity:0;
    pointer-events:none;
  }
  .float-block.cracking .crack{ opacity:1; }
  .float-block:hover{ filter:brightness(1.15); }
  .float-block.popped{ animation:pop 0.35s forwards; }
  @keyframes pop{
    0%{ transform:scale(1); opacity:1; }
    60%{ transform:scale(1.3) rotate(8deg); opacity:1; }
    100%{ transform:scale(0) rotate(20deg); opacity:0; }
  }
  @keyframes bob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-14px); }
  }

  /* Torch */
  .torch{
    position:absolute;
    width:20px; height:36px;
  }
  .torch-stick{
    position:absolute;
    left:8px; top:12px;
    width:4px; height:24px;
    background:var(--dirt-dark);
  }
  .torch-flame{
    position:absolute;
    left:2px; top:0;
    width:16px; height:16px;
    background:radial-gradient(circle at 50% 60%, #FFF3B0 0%, var(--torch) 45%, #E2600A 80%, transparent 100%);
    animation:flicker 0.4s infinite steps(2);
  }
  .torch-glow{
    position:absolute;
    left:-24px; top:-24px;
    width:68px; height:68px;
    background:radial-gradient(circle, rgba(255,178,56,0.35) 0%, transparent 70%);
    animation:flicker 0.4s infinite steps(2);
  }
  @keyframes flicker{
    0%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.85; transform:scale(0.94); }
    100%{ opacity:1; transform:scale(1.03); }
  }

  /* ===================== LOGIN PANEL (chest/inventory styled) ===================== */
  #panel-wrap{
    position:relative;
    z-index:10;
    width:100%; height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .panel{
    width:380px;
    max-width:90vw;
    background:var(--ui-bg);
    border:6px solid var(--ui-dark);
    box-shadow:
      inset 4px 4px 0 rgba(255,138,61,0.18),
      inset -4px -4px 0 rgba(0,0,0,0.5),
      0 0 0 3px rgba(232,68,44,0.35),
      0 12px 0 rgba(0,0,0,0.5),
      0 16px 32px rgba(0,0,0,0.55);
    padding:22px 20px 26px;
    animation:panelIn 0.5s steps(6) both;
  }
  @keyframes panelIn{
    from{ transform:translateY(24px) scale(0.96); opacity:0; }
    to{ transform:translateY(0) scale(1); opacity:1; }
  }

  .panel-title{
    font-family:var(--font-pixel);
    font-size:15px;
    background:linear-gradient(90deg, var(--ember), var(--grass-side));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-align:center;
    line-height:1.8;
    margin-bottom:4px;
  }
  .panel-tagline{
    font-family:var(--font-body);
    font-size:15px;
    letter-spacing:1px;
    color:#8a8a90;
    text-align:center;
    margin-bottom:10px;
  }
  .panel-sub{
    font-family:var(--font-body);
    font-size:16px;
    color:#9a9aa0;
    text-align:center;
    margin-bottom:18px;
  }

  .slot-label{
    font-family:var(--font-body);
    font-size:16px;
    color:var(--text-dark);
    margin-bottom:5px;
    display:block;
  }

  .slot{
    position:relative;
    margin-bottom:14px;
  }
  .slot input{
    width:100%;
    font-family:var(--font-body);
    font-size:18px;
    padding:10px 12px;
    background:#101013;
    border:none;
    outline:none;
    color:#fff;
    box-shadow:
      inset 3px 3px 0 rgba(0,0,0,0.5),
      inset -3px -3px 0 rgba(255,138,61,0.08);
    caret-color:var(--ember);
  }
  .slot input::placeholder{ color:#5a5a60; }
  .slot input:focus{
    box-shadow:
      inset 3px 3px 0 rgba(0,0,0,0.5),
      inset -3px -3px 0 rgba(255,138,61,0.08),
      0 0 0 3px var(--gold);
  }

  .row-remember{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:6px 0 18px;
    font-size:15px;
    color:#9a9aa0;
  }
  .checkbox-slot{
    width:20px; height:20px;
    background:#101013;
    box-shadow:inset 2px 2px 0 rgba(0,0,0,0.5), inset -2px -2px 0 rgba(255,138,61,0.08);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-right:6px;
    cursor:pointer;
    font-size:14px;
    color:var(--ember);
    vertical-align:middle;
  }
  .remember-label{ display:flex; align-items:center; cursor:pointer; user-select:none; }
  .forgot-link{ color:var(--ember); cursor:pointer; text-decoration:none; }
  .forgot-link:hover{ text-decoration:underline; }

  .mc-button{
    width:100%;
    display:block;
    font-family:var(--font-pixel);
    font-size:13px;
    color:#fff;
    text-shadow:2px 2px 0 rgba(0,0,0,0.5);
    background:linear-gradient(90deg, var(--grass-top), var(--gold));
    border:none;
    padding:16px 10px;
    cursor:pointer;
    box-shadow:
      inset 3px 3px 0 rgba(255,255,255,0.2),
      inset -4px -4px 0 rgba(0,0,0,0.35);
    position:relative;
    letter-spacing:0.5px;
    transition:transform 0.05s;
  }
  .mc-button:hover{ filter:brightness(1.08); }
  .mc-button:active{
    transform:translateY(2px);
    box-shadow:
      inset 3px 3px 0 rgba(0,0,0,0.25),
      inset -2px -2px 0 rgba(255,255,255,0.15);
  }
  .mc-button.loading{
    color:transparent;
  }
  .mc-button .spinner-crack{
    position:absolute; inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    font-family:var(--font-pixel);
    font-size:11px;
    color:#fff;
    text-shadow:2px 2px 0 rgba(0,0,0,0.5);
  }
  .mc-button.loading .spinner-crack{ display:flex; }

  .divider-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin:18px 0 14px;
  }
  .divider-row .line{ flex:1; height:3px; background:repeating-linear-gradient(90deg, var(--stone-dark) 0 4px, transparent 4px 8px); }
  .divider-row span{ font-size:14px; color:#6a6a70; }

  .signup-line{
    text-align:center;
    font-size:16px;
    color:#9a9aa0;
    margin-top:6px;
  }
  .signup-line a{ color:var(--ember); text-decoration:none; }
  .signup-line a:hover{ text-decoration:underline; }

  .hint-toast{
    position:fixed;
    bottom:24px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:rgba(0,0,0,0.75);
    color:#fff;
    font-family:var(--font-body);
    font-size:16px;
    padding:8px 16px;
    border:2px solid #000;
    opacity:0;
    transition:all 0.25s;
    pointer-events:none;
    z-index:50;
  }
  .hint-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:480px){
    .panel{ padding:18px 16px 22px; }
    .panel-title{ font-size:11px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }
</style>
</head>
<body>

<div id="world">
  <div id="parallax-far"></div>
  <div id="parallax-near">
    <div class="terrain" id="terrain"></div>
  </div>
</div>

<div id="panel-wrap">
  <form class="panel" id="login-form" autocomplete="off">
    <div class="panel-title">MAJU CODECRAFT</div>
    <div class="panel-tagline">Code . Innovate . Compete</div>
    <div class="panel-sub">place your credentials to spawn in</div>

    <div class="slot">
      <label class="slot-label" for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="dev_wassam" required>
    </div>

    <div class="slot">
      <label class="slot-label" for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>
    </div>

    <div class="row-remember">
      <label class="remember-label">
        <span class="checkbox-slot" id="remember-box"></span>
        Keep me logged in
      </label>
      <a class="forgot-link" id="forgot-link">Forgot password?</a>
    </div>

    <button type="submit" class="mc-button" id="submit-btn">
      <span class="btn-text">SIGN IN</span>
      <span class="spinner-crack">LOADING...</span>
    </button>

    <div class="divider-row"><div class="line"></div><span>or</span><div class="line"></div></div>

    <div class="signup-line">New player? <a id="signup-link">Create an account</a></div>
  </form>
</div>

<div class="hint-toast" id="toast"></div>

<script>
(function(){
  // ---------- Build terrain strip ----------
  const terrain = document.getElementById('terrain');
  const colCount = Math.ceil(window.innerWidth / 64) + 2;
  for(let i=0;i<colCount;i++){
    const col = document.createElement('div');
    col.className = 'block-col';
    col.innerHTML = `
      <div class="block grass-block"></div>
      <div class="block dirt-block"></div>
      <div class="block dirt-block"></div>
      <div class="block stone-block"></div>
    `;
    terrain.appendChild(col);
  }

  // ---------- Clouds ----------
  const far = document.getElementById('parallax-far');
  function makeCloud(){
    const c = document.createElement('div');
    c.className = 'cloud';
    const w = 90 + Math.random()*70;
    const h = w*0.42;
    c.style.width = w+'px';
    c.style.height = h+'px';
    c.style.top = (5 + Math.random()*35) + '%';
    const dur = 40 + Math.random()*40;
    c.style.animationDuration = dur+'s';
    c.style.animationDelay = (-Math.random()*dur)+'s';
    c.innerHTML = `<svg viewBox="0 0 100 42" xmlns="http://www.w3.org/2000/svg">
      <g fill="#4A4045" opacity="0.85">
        <rect x="10" y="18" width="70" height="18"/>
        <rect x="20" y="8" width="40" height="14"/>
        <rect x="0" y="24" width="14" height="10"/>
        <rect x="82" y="22" width="14" height="10"/>
      </g>
    </svg>`;
    far.appendChild(c);
  }
  for(let i=0;i<5;i++) makeCloud();

  // ---------- Floating ore blocks ----------
  const near = document.getElementById('parallax-near');
  const oreTypes = ['gold','diamond',''];
  const blockCount = window.innerWidth < 700 ? 3 : 6;
  for(let i=0;i<blockCount;i++){
    const b = document.createElement('div');
    const type = oreTypes[Math.floor(Math.random()*oreTypes.length)];
    b.className = 'float-block' + (type ? ' '+type : '');
    b.style.left = (5 + Math.random()*85) + '%';
    b.style.top = (8 + Math.random()*45) + '%';
    b.style.animationDelay = (-Math.random()*3.2)+'s';
    b.innerHTML = '<div class="crack"></div>';
    let hits = 0;
    b.addEventListener('click', () => {
      hits++;
      if(hits < 3){
        b.classList.add('cracking');
        setTimeout(()=>b.classList.remove('cracking'), 150);
      } else {
        b.classList.add('popped');
        showToast(type ? `You mined ${type}!` : 'Block broken!');
        setTimeout(()=>{
          b.classList.remove('popped');
          b.style.left = (5 + Math.random()*85) + '%';
          b.style.top = (8 + Math.random()*45) + '%';
          hits = 0;
        }, 400);
      }
    });
    near.appendChild(b);
  }

  // ---------- Torches ----------
  [ {left:'6%', top:'55%'}, {left:'88%', top:'50%'} ].forEach(pos=>{
    const t = document.createElement('div');
    t.className = 'torch';
    t.style.left = pos.left;
    t.style.top = pos.top;
    t.innerHTML = `<div class="torch-glow"></div><div class="torch-stick"></div><div class="torch-flame"></div>`;
    near.appendChild(t);
  });

  // ---------- Mouse parallax ----------
  document.addEventListener('mousemove', (e)=>{
    const x = (e.clientX / window.innerWidth - 0.5);
    const y = (e.clientY / window.innerHeight - 0.5);
    far.style.transform = `translate(${x*-10}px, ${y*-6}px)`;
    near.style.transform = `translate(${x*-20}px, ${y*-10}px)`;
  });

  // ---------- Toast ----------
  const toast = document.getElementById('toast');
  let toastTimer;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toast.classList.remove('show'), 1600);
  }

  // ---------- Remember checkbox ----------
  const rememberBox = document.getElementById('remember-box');
  let remembered = false;
  rememberBox.addEventListener('click', ()=>{
    remembered = !remembered;
    rememberBox.textContent = remembered ? '✓' : '';
  });

  document.getElementById('forgot-link').addEventListener('click', ()=>{
    showToast('Password reset scroll sent (demo)');
  });
  document.getElementById('signup-link').addEventListener('click', ()=>{
    showToast('Sign-up world not generated yet (demo)');
  });

  // ---------- Form submit -> redirect ----------
  const form = document.getElementById('login-form');
  const btn = document.getElementById('submit-btn');
  form.addEventListener('submit', (e)=>{
    e.preventDefault();
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value.trim();
    if(!user || !pass){
      showToast('Fill in both slots first!');
      return;
    }
    btn.classList.add('loading');
    btn.disabled = true;
    try{
      sessionStorage.setItem('mc_username', user);
    }catch(err){}
    setTimeout(()=>{
      window.location.href = 'https://claude.ai/artifact/AN5iCJ6iY9b2YEJbokcA9y';
    }, 900);
  });
})();
</script>
</body>
</html>
